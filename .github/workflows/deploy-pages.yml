name: Deploy Static Portfolio to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site from Markdown
        id: build-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_PATH=$(node -e "const u = new URL('${{ steps.pages.outputs.base_url }}' || 'https://itsthemaverick.github.io/personal-site/'); console.log(u.pathname === '/' ? '' : u.pathname.replace(/\/$/, ''));")
          if [ -f "scripts/build-static.mjs" ]; then
            node scripts/build-static.mjs --base-path="$BASE_PATH"
            echo "dist_path=dist" >> "$GITHUB_OUTPUT"
          elif [ -f "static-migration/scripts/build-static.mjs" ]; then
            node static-migration/scripts/build-static.mjs --base-path="$BASE_PATH"
            echo "dist_path=static-migration/dist" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find build-static.mjs" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-site.outputs.dist_path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
